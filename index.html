<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Study Buddy</title>
</head>

<body>

<h1>Study Buddy</h1>

<p>ระบบช่วยจัดการห้องเรียน</p>

<hr>

<button onclick="show('home')">หน้าหลัก</button>
<button onclick="show('schedule')">ตารางเรียน</button>
<button onclick="show('work')">งานที่ต้องส่ง</button>
<button onclick="show('exam')">ตารางสอบ</button>
<button onclick="show('appointment')">นัดหมาย</button>
<button onclick="show('announcement')">ประกาศ</button>

<hr>

<div id="content">

<h2>หน้าหลัก</h2>
<p>ยินดีต้อนรับเข้าสู่ Study Buddy</p>

</div>

<script>

function show(page){

let content = document.getElementById("content");

if(page === "home"){

content.innerHTML = `
<h2>หน้าหลัก</h2>
<p>ยินดีต้อนรับเข้าสู่ Study Buddy</p>
`;

}

if(page === "schedule"){

content.innerHTML = `
<h2>ตารางเรียน</h2>
<input id="subject" placeholder="ชื่อวิชา">
<input id="time" placeholder="เวลา">
<button onclick="addSchedule()">เพิ่ม</button>
<div id="list"></div>
`;

}

if(page === "work"){

content.innerHTML = `
<h2>งานที่ต้องส่ง</h2>
<input id="work" placeholder="ชื่องาน">
<button onclick="addWork()">เพิ่ม</button>
<div id="list"></div>
`;

}

if(page === "exam"){

content.innerHTML = `
<h2>ตารางสอบ</h2>
<input id="exam" placeholder="วิชาที่สอบ">
<button onclick="addExam()">เพิ่ม</button>
<div id="list"></div>
`;

}

if(page === "appointment"){

content.innerHTML = `
<h2>นัดหมาย</h2>
<input id="appointment" placeholder="รายละเอียดนัดหมาย">
<button onclick="addAppointment()">เพิ่ม</button>
<div id="list"></div>
`;

}

if(page === "announcement"){

content.innerHTML = `
<h2>ประกาศ</h2>
<input id="announcement" placeholder="ข้อความประกาศ">
<button onclick="addAnnouncement()">เพิ่ม</button>
<div id="list"></div>
`;

}

}


function addSchedule(){

let subject=document.getElementById("subject").value;
let time=document.getElementById("time").value;

document.getElementById("list").innerHTML +=
"<p>📚 "+subject+" | "+time+
" <button onclick='this.parentElement.remove()'>ลบ</button></p>";

}


function addWork(){

let work=document.getElementById("work").value;

document.getElementById("list").innerHTML +=
"<p>📝 "+work+
" <button onclick='this.parentElement.remove()'>ลบ</button></p>";

}


function addExam(){

let exam=document.getElementById("exam").value;

document.getElementById("list").innerHTML +=
"<p>📄 "+exam+
" <button onclick='this.parentElement.remove()'>ลบ</button></p>";

}


function addAppointment(){

let appointment=document.getElementById("appointment").value;

document.getElementById("list").innerHTML +=
"<p>📌 "+appointment+
" <button onclick='this.parentElement.remove()'>ลบ</button></p>";

}


function addAnnouncement(){

let announcement=document.getElementById("announcement").value;

document.getElementById("list").innerHTML +=
"<p>📢 "+announcement+
" <button onclick='this.parentElement.remove()'>ลบ</button></p>";

}

</script>

</body>
</html>

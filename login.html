<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 20px;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 20px 0 5px;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #172033;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #message {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .demo {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">SB</div>

    <h1>Study Buddy</h1>
    <div class="subtitle">ระบบช่วยจัดการห้องเรียน</div>

    <label>ชื่อผู้ใช้</label>
    <input
        type="text"
        id="username"
        placeholder="กรอกชื่อผู้ใช้"
    >

    <label>รหัสผ่าน</label>
    <input
        type="password"
        id="password"
        placeholder="กรอกรหัสผ่าน"
    >

    <button onclick="login()">เข้าสู่ระบบ</button>

    <div id="message"></div>

    <div class="demo">
        Username: student<br>
        Password: 1234
    </div>

</div>

<script>
function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username === "student" && password === "1234") {

        // จำสถานะการเข้าสู่ระบบ
        sessionStorage.setItem("studyBuddyLogin", "true");

        // ไปหน้าแรก
        window.location.href = "index.html";

    } else {

        document.getElementById("message").textContent =
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 18px 0 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            color: red;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        SB
    </div>

    <h1>Study Buddy</h1>

    <p class="subtitle">
        เข้าสู่ระบบ
    </p>

    <label>ชื่อผู้ใช้</label>

    <input
        id="username"
        type="text"
        placeholder="ชื่อผู้ใช้"
    >

    <label>รหัสผ่าน</label>

    <input
        id="password"
        type="password"
        placeholder="รหัสผ่าน"
    >

    <button onclick="login()">
        เข้าสู่ระบบ
    </button>

    <p id="message"></p>

</div>


<script>

function login() {

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;

    if (username === "student" && password === "1234") {

        window.location.href = "index.html";

    } else {

        document.getElementById("message").innerText =
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";

    }

}

</script>

</body>

</html>

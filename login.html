<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 22px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.25);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: auto;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;

            margin: 20px 0 5px;
        }

        .subtitle {
            text-align: center;
            color: #718096;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin: 15px 0 7px;

            font-weight: bold;
            color: #172033;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #dbe2ea;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #message {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            color: #dc2626;
        }

        .demo {
            margin-top: 20px;

            text-align: center;

            color: #718096;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        SB
    </div>

    <h1>Study Buddy</h1>

    <div class="subtitle">
        ระบบช่วยจัดการห้องเรียน
    </div>


    <label for="username">
        ชื่อผู้ใช้
    </label>

    <input
        id="username"
        type="text"
        placeholder="กรอกชื่อผู้ใช้"
        autocomplete="username"
    >


    <label for="password">
        รหัสผ่าน
    </label>

    <input
        id="password"
        type="password"
        placeholder="กรอกรหัสผ่าน"
        autocomplete="current-password"
    >


    <button type="button" onclick="login()">
        เข้าสู่ระบบ
    </button>


    <div id="message"></div>


    <div class="demo">
        Username: student<br>
        Password: 1234
    </div>

</div>


<script>

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    if (
        username === "student" &&
        password === "1234"
    ) {

        sessionStorage.setItem(
            "studyBuddyLogin",
            "true"
        );

        window.location.href =
            "index.html";

    } else {

        document.getElementById("message").textContent =
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
    }
}

</script>

</body>
</html>
